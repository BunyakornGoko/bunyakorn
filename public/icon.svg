<svg width="180" height="180" viewBox="0 0 180 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="rounded">
      <rect width="180" height="180" rx="40"/>
    </clipPath>
    <radialGradient id="space-bg" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#0F0A2E"/>
      <stop offset="100%" stop-color="#030712"/>
    </radialGradient>
    <radialGradient id="core-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"  stop-color="#FFFFFF"  stop-opacity="1"/>
      <stop offset="18%" stop-color="#C7E0FF"  stop-opacity="0.85"/>
      <stop offset="45%" stop-color="#5B9CF6"  stop-opacity="0.45"/>
      <stop offset="75%" stop-color="#4338CA"  stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#4338CA" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nebula-a" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#818CF8" stop-opacity="0.55"/>
      <stop offset="55%"  stop-color="#6366F1" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#4338CA" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nebula-b" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#93C5FD" stop-opacity="0.4"/>
      <stop offset="60%"  stop-color="#5B9CF6" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
    <filter id="f-core" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <filter id="f-arm" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <filter id="f-star-glow" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="f-nucleus" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <g clip-path="url(#rounded)">
    <!-- Deep space background -->
    <rect width="180" height="180" fill="url(#space-bg)"/>

    <!-- Nebula arms -->
    <ellipse cx="90" cy="90" rx="80" ry="28"
      fill="url(#nebula-a)" filter="url(#f-arm)"
      transform="rotate(-35 90 90)"/>
    <ellipse cx="90" cy="90" rx="68" ry="22"
      fill="url(#nebula-b)" filter="url(#f-arm)"
      transform="rotate(55 90 90)"/>

    <!-- Galaxy halo glow -->
    <circle cx="90" cy="90" r="52" fill="url(#core-glow)" filter="url(#f-core)"/>

    <!-- ── Stars ── -->
    <!-- Outer ring -->
    <circle cx="32"  cy="38"  r="1.2" fill="#FFFFFF" opacity="0.55"/>
    <circle cx="155" cy="30"  r="1"   fill="#BFD7FF" opacity="0.5"/>
    <circle cx="160" cy="72"  r="1.2" fill="#FFFFFF" opacity="0.6"/>
    <circle cx="158" cy="138" r="1"   fill="#E8F0FF" opacity="0.45"/>
    <circle cx="22"  cy="145" r="1.2" fill="#FFFFFF" opacity="0.5"/>
    <circle cx="18"  cy="90"  r="1"   fill="#BFD7FF" opacity="0.55"/>
    <circle cx="78"  cy="16"  r="1.5" fill="#FFFFFF" opacity="0.6"/>
    <circle cx="115" cy="162" r="1.2" fill="#E8F0FF" opacity="0.5"/>
    <circle cx="42"  cy="160" r="1"   fill="#FFFFFF" opacity="0.45"/>

    <!-- Mid ring -->
    <circle cx="48"  cy="52"  r="1.8" fill="#FFFFFF" opacity="0.75" filter="url(#f-star-glow)"/>
    <circle cx="140" cy="48"  r="1.5" fill="#BFD7FF" opacity="0.7"/>
    <circle cx="148" cy="112" r="1.8" fill="#FFFFFF" opacity="0.65" filter="url(#f-star-glow)"/>
    <circle cx="38"  cy="125" r="1.5" fill="#E8F0FF" opacity="0.7"/>
    <circle cx="92"  cy="155" r="1.5" fill="#FFFFFF" opacity="0.6"/>
    <circle cx="130" cy="150" r="1.2" fill="#BFD7FF" opacity="0.55"/>

    <!-- Near-core bright stars -->
    <circle cx="62"  cy="68"  r="2.2" fill="#FFFFFF" opacity="0.85" filter="url(#f-star-glow)"/>
    <circle cx="118" cy="62"  r="1.8" fill="#E8F0FF" opacity="0.8"  filter="url(#f-star-glow)"/>
    <circle cx="122" cy="112" r="2.2" fill="#FFFFFF" opacity="0.8"  filter="url(#f-star-glow)"/>
    <circle cx="65"  cy="118" r="1.8" fill="#BFD7FF" opacity="0.75" filter="url(#f-star-glow)"/>
    <circle cx="72"  cy="93"  r="1.5" fill="#FFFFFF" opacity="0.7"/>
    <circle cx="108" cy="87"  r="1.5" fill="#E8F0FF" opacity="0.7"/>
    <circle cx="90"  cy="62"  r="2"   fill="#FFFFFF" opacity="0.8"  filter="url(#f-star-glow)"/>
    <circle cx="92"  cy="118" r="1.8" fill="#BFD7FF" opacity="0.75"/>

    <!-- Galaxy nucleus -->
    <circle cx="90" cy="90" r="7" fill="#FFFFFF" filter="url(#f-nucleus)"/>
    <circle cx="90" cy="90" r="3" fill="#FFFFFF"/>
  </g>
</svg>
